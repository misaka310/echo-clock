<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7d94a8">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Echo Show 11 向けの背景と時計・日付・東京の天気表示">
  <title>Echo Show 11 | Clock</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="./styles.css?v=5">
  <script defer src="./app.js?v=5"></script>
  <!-- Third-party code: DaGammla / Keep Silk Open (MIT), see vendor/keep-silk-open/LICENSE -->
  <script defer src="./vendor/keep-silk-open/keep.js"></script>
</head>
<body>
  <main class="dashboard" aria-label="背景、時計、日付、東京の現在の天気">
    <div class="background" aria-hidden="true"></div>
    <section class="info-panel" aria-label="東京の時刻と天気">
      <time class="clock" id="clock" aria-label="東京の現在時刻">--:--</time>
      <p class="date" id="date">—</p>
      <p class="weather-line" id="weather-line" title="気象データ取得中">
        <span class="city">東京</span>
        <span class="weather-icon" id="weather-icon" aria-hidden="true">—</span>
        <span class="weather-name" id="weather-name"></span>
        <span class="temperature" id="temperature">--°C</span>
      </p>
    </section>
    <button id="start-button" class="start-button" type="button" aria-label="再生して画面を維持する"><span class="start-button-icon" aria-hidden="true">▶</span><span class="start-button-note">再生（画面を維持）</span></button>
  </main>
</body>
</html>
